[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lineart-pipeline"
version = "1.0.0"
description = "Raster image to coloring-book SVG pipeline (DexiNed edges, region graph, topology-preserving vectorisation)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "scikit-image>=0.22",
    "scikit-learn>=1.4",
    "scipy>=1.11",
    "pillow>=10.0",
    "onnxruntime>=1.17",
    "onnx>=1.16",
]

[project.optional-dependencies]
preview = ["cairosvg>=2.7"]
dev = ["cairosvg>=2.7", "pytest>=8"]

[project.scripts]
lineart = "lineart.cli:main"

[tool.setuptools]
packages = ["lineart"]

[tool.pytest.ini_options]
testpaths = ["tests"]
